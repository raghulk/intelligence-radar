[project]
name = "intelligence-radar"
version = "0.1.0"
requires-python = ">=3.11"
description = "Dhaga & Co. vendor-fit discovery MVP"
dependencies = [
	"gradio==6.29.1",
	"langchain-core==1.6.6",
	"langchain-openai==1.6.7",
	"pandas==2.3.3",
	"psycopg[binary]==3.3.6",
	"pydantic==2.13.5",
	"python-dotenv==1.2.4",
	"tiktoken==0.14.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]